<div class="app-container">
  <!-- Si l'utilisateur n'est pas authentifié, on affiche le composant Welcome -->
  <app-welcome *ngIf="!isAuthenticated"></app-welcome>
  
  <!-- Si l'utilisateur est authentifié, on affiche l'application principale -->
  <div *ngIf="isAuthenticated" class="content">
    <app-primeng-playlist></app-primeng-playlist>
    <app-primeng-music></app-primeng-music>
  </div>
</div>
